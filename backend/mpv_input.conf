#
# Kettle's playback keys (the playback controls work; docs/spec.md, "Playback controls").
# backend/mpv.py gives this file to mpv at every launch (--input-conf), and
# switches every other mpv key off (--no-input-default-bindings). The
# user's own input.conf is not read then. Nothing is written to mpv's
# settings folder.
#
# Steam Input turns the controller's buttons into the keys below (the
# layout steps are in docs/device-setup.md). Each line: key, what it does,
# and after "#" the button that sends it. The words on screen come from
# backend/mpv_scripts/playback_controls.lua.
#
# B (q) and Esc quit here. When Kettle also passes its Continue watching
# script (backend/mpv_scripts/quit_capture.lua), that script takes q and
# Esc first, saves the position and the frame, then quits the same way.
#
# Start sends m, which opens the menu in Kettle's list (the Home actions work) and does
# nothing here. Buttons that send no key in Kettle's layout, so they do
# nothing here:
# nothing: L2, R2, right stick, Select

SPACE          script-binding playback_controls/play-pause     # A
q              quit                                            # B
LEFT           script-binding playback_controls/back-10s       # D-pad Left, left stick left
RIGHT          script-binding playback_controls/forward-10s    # D-pad Right, left stick right
j              script-binding playback_controls/back-1min      # L1
l              script-binding playback_controls/forward-1min   # R1
BS             script-binding playback_controls/next-subtitle  # X
a              script-binding playback_controls/next-audio     # Y
UP             script-binding playback_controls/show-where     # D-pad Up
DOWN           ignore                                          # D-pad Down
m              ignore                                          # Start
ESC            quit                                            # keyboard Esc
MBTN_LEFT      script-binding playback_controls/play-pause     # touch: one tap
MBTN_LEFT_DBL  ignore                                          # touch: a second quick tap
